[devshell]
name = "// hypermodern // nixos"

motd = '''

// hypermodern // nixos
  
  all the speed he took, all the turns he'd taken and the corners he'd cut
in night city, and still he'd see the matrix in his sleep, bright lattices
of logic unfolding across that colorless void...
'''
packages = ["nh", "ast-grep"]

[[commands]]
name = "switch-os"
help = "i had to switch it on em..."
category = "development"
command = "nh os switch ."

[[commands]]
name = "switch-home"
help = "...flipmode is the greatest"
category = "development"
command = "nh home switch ."

[[commands]]
name = "treefmt"
help = "legiblibility is next to godliness"
category = "development"
command = "nix fmt"

[[commands]]
name = "tailscale-up-current-user"
help = "tailscale logged-in user as the operator"
category = "network"
command = "sudo tailscale up --operator=$(whoami)"

[[commands]]
name = "list-tailscale-networks"
help = "Alias for somewhat non-obvious command"
category = "network"
command = "sudo tailscale switch --list"

[[commands]]
name = "sg"
help = "ast-grep: structural search/replace (sg -p 'pattern' or sg scan)"
category = "development"
command = "ast-grep $@"

[[commands]]
name = "refactor"
help = "ast-grep replace: refactor 'old_pattern' 'new_pattern' --lang nix"
category = "development"
command = "ast-grep --pattern \"$1\" --rewrite \"$2\" ${3:---lang nix} --update-all"
