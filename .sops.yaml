# SOPS configuration file
# Generate age keys with: age-keygen -o key.txt
# Generate SSH keys with: ssh-keygen -t ed25519
keys:
  # User key - replace with your own public key
  - &user_key age1v6f0j4xpmpqme7gacs46939nlvt4rnazvcat498nx4z6qn485elqfwfjl8
  - &user_key2 age1n6yhe8jetw2w52xf7nf87up076p03jxmynuqgy7yp5a97744ja0sgy7llz
  # Host keys - add your hosts here
  - &host_watchtower age-ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL1leLW7+bvGikmZbAZlAVD7gySRTirnkm7HDD9ft3yk
creation_rules:
  # System-wide secrets (accessible by root)
  - path_regex: secrets/system-secrets\.ya?ml$
    key_groups:
      - age:
          - *host_watchtower
  # User-specific secrets
  - path_regex: secrets/user-secrets\.ya?ml$
    key_groups:
      - age:
          - *user_key
          - *user_key2
          - *host_watchtower
  # Temporary file for testing
  - path_regex: /tmp/.*\.ya?ml$
    key_groups:
      - age:
          - *user_key
          - *user_key2
