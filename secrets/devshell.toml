[devshell]
name = "hypermonder-secrets"

motd = '''

    "and arranged to become a partron of the aeschmann colection. the aeschmann
collection was restricted to the work of psychotics."
  
  rekey-secrets    // update all secrets with current keys
  list-secrets    // show all secrets and their encryption status
  view-secret    // decrypt and display a secret
  edit-secret   // edit a secret with $EDITOR
'''

packages = [
  "age",
  "age-plugin-yubikey",
  "jq",
  "rage",
  "ssh-to-age",
  "yubikey-manager",
  "sops",
]

[[commands]]
name = "sync-json-keys-to-nix"
help = "over-write keys.nix with the contents of keys.json"
category = "keys"
command = '''
  if [ ! -f keys.json ]; then
    echo "Error: keys.json not found"
    exit 1
  fi
  
  # Create temp file because nix can't read /dev/stdin reliably
  tmpfile=$(mktemp)
  cat keys.json > "$tmpfile"
  
  echo "# Generated from keys.json - DO NOT EDIT" > keys.nix
  echo "# Run sync-json-keys-to-nix to regenerate" >> keys.nix
  echo >> keys.nix
  nix eval --impure --expr "builtins.fromJSON (builtins.readFile \"$tmpfile\")" >> keys.nix
  
  rm -f "$tmpfile"
  echo "✓ Synced keys.json → keys.nix"
'''

[[commands]]
name = "sync-nix-keys-to-json"
help = "over-write keys.json with the contents of keys.nix"
category = "keys"
command = '''
  if [ ! -f keys.nix ]; then
    echo "Error: keys.nix not found"
    exit 1
  fi
  nix eval --json -f keys.nix | jq '.' > keys.json.tmp && mv keys.json.tmp keys.json
  echo "✓ Synced keys.nix → keys.json"
'''

[[commands]]
name = "list-secrets"
help = "lists all specified secrets and their encryption status"
category = "secrets"
command = '''
  echo "Checking secrets..."
  echo
  printf "%-50s %s\n" "SECRET" "STATUS"
  printf "%-50s %s\n" "------" "------"
  
  # Find all .age files
  find secrets -name "*.age" -type f | sort | while read -r secret; do
    if [ -f "$secret" ]; then
      printf "%-50s ✓ encrypted\n" "$secret"
    else
      printf "%-50s ✗ missing\n" "$secret"
    fi
  done
  
  # Check secrets.nix for any defined but missing
  if [ -f secrets.nix ]; then
    echo
    echo "Defined in secrets.nix but missing:"
    # This is rough but works for typical agenix format
    grep -o '"[^"]*\.age"' secrets.nix | tr -d '"' | while read -r expected; do
      if [ ! -f "$expected" ]; then
        echo "  ✗ $expected"
      fi
    done
  fi
'''

[[commands]]
name = "init-secrets"
help = "create missing secret files with placeholder content"
category = "secrets"
command = '''
  if [ ! -f secrets.nix ]; then
    echo "Error: secrets.nix not found"
    exit 1
  fi
  
  echo "Initializing missing secrets..."
  grep -o '"[^"]*\.age"' secrets.nix | tr -d '"' | while read -r secret; do
    if [ ! -f "$secret" ]; then
      echo "Creating $secret..."
      mkdir -p "$(dirname "$secret")"
      echo "PLACEHOLDER_SECRET_PLEASE_EDIT" | agenix -e "$secret"
    fi
  done
  echo "✓ All secrets initialized"
'''

[[commands]]
name = "rekey-secrets"
help = "updates all secrets to honor the currently specified keys"
category = "secrets"
command = "agenix -r && echo '✓ All secrets rekeyed'"

[[commands]]
name = "view-secret"
help = "decrypts and prints a secret to stdout (usage: view-secret <path>)"
category = "secrets"
command = '''
  if [ -z "$1" ]; then
    echo "Usage: view-secret <secret-path>"
    echo
    echo "Available secrets:"
    find secrets -name "*.age" -type f | sort | sed 's/^/  /'
    exit 1
  fi
  
  if [ ! -f "$1" ]; then
    echo "Error: Secret '$1' not found"
    echo
    echo "Available secrets:"
    find secrets -name "*.age" -type f | sort | sed 's/^/  /'
    exit 1
  fi
  
  EDITOR=cat agenix -e "$@"
'''

[[commands]]
name = "edit-secret"
help = "edits a secret in-place with $EDITOR (usage: edit-secret <path>)"
category = "secrets"
command = '''
  if [ -z "$1" ]; then
    echo "Usage: edit-secret <secret-path>"
    echo
    echo "Available secrets:"
    find secrets -name "*.age" -type f | sort | sed 's/^/  /'
    exit 1
  fi
  
  if [ ! -f "$1" ]; then
    echo "Error: Secret '$1' not found"
    echo
    echo "Create it first with: echo 'your-secret' | agenix -e '$1'"
    exit 1
  fi
  
  agenix -e "$@"
'''

[[commands]]
name = "new-secret"
help = "create a new secret (usage: new-secret <path>)"
category = "secrets"
command = '''
  if [ -z "$1" ]; then
    echo "Usage: new-secret <path>"
    echo
    echo "Example: new-secret secrets/prod/api-key.age"
    exit 1
  fi
  
  if [ -f "$1" ]; then
    echo "Error: Secret '$1' already exists"
    echo "Use edit-secret to modify it"
    exit 1
  fi
  
  mkdir -p "$(dirname "$1")"
  echo "# Enter your secret below (this line will be removed)" > /tmp/new-secret.tmp
  ${EDITOR:-vi} /tmp/new-secret.tmp
  grep -v '^#' /tmp/new-secret.tmp | agenix -e "$1"
  rm -f /tmp/new-secret.tmp
  echo "✓ Created $1"
'''

[[commands]]
name = "rotate-secret"
help = "rotate a secret by creating a backup and editing (usage: rotate-secret <path>)"
category = "secrets"
command = '''
  if [ -z "$1" ]; then
    echo "Usage: rotate-secret <secret-path>"
    echo
    echo "Available secrets:"
    find secrets -name "*.age" -type f | sort | sed 's/^/  /'
    exit 1
  fi
  
  if [ ! -f "$1" ]; then
    echo "Error: Secret '$1' not found"
    exit 1
  fi
  
  # Create backup
  backup="$1.backup.$(date +%Y%m%d-%H%M%S)"
  cp "$1" "$backup"
  echo "✓ Backup created: $backup"
  
  # Edit the secret
  agenix -e "$1"
  echo "✓ Secret rotated"
'''

[[commands]]
name = "diff-secrets"
help = "compare secrets between git commits (usage: diff-secrets [commit])"
category = "secrets"
command = '''
  commit=${1:-HEAD}
  echo "Comparing secrets with $commit..."
  
  git diff --name-only "$commit" -- '*.age' | while read -r file; do
    echo
    echo "=== $file ==="
    echo "Old:"
    git show "$commit:$file" 2>/dev/null | age -d -i ~/.ssh/id_ed25519 2>/dev/null || echo "  (unable to decrypt)"
    echo "New:"
    age -d -i ~/.ssh/id_ed25519 < "$file" 2>/dev/null || echo "  (unable to decrypt)"
  done
'''

[[commands]]
name = "validate-secrets"
help = "validate all secrets can be decrypted"
category = "secrets"
command = '''
  echo "Validating secrets..."
  errors=0
  
  find secrets -name "*.age" -type f | sort | while read -r secret; do
    if age -d -i ~/.ssh/id_ed25519 < "$secret" > /dev/null 2>&1; then
      echo "✓ $secret"
    else
      echo "✗ $secret (failed to decrypt)"
      errors=$((errors + 1))
    fi
  done
  
  if [ $errors -eq 0 ]; then
    echo
    echo "✓ All secrets valid"
  else
    echo
    echo "✗ $errors secrets failed validation"
    exit 1
  fi
'''
