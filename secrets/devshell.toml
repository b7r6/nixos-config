[devshell]
name = "hypermodern-secrets"

motd = '''

    "and arranged to become a patron of the aeschmann collection. the aeschmann
collection was restricted to the work of psychotics."
  
  Agenix (NixOS-deployed secrets):
    list-secrets     // show all secrets and encryption status
    view-secret      // decrypt and display a secret
    edit-secret      // edit a secret with $EDITOR
    rekey-secrets    // update all secrets with current keys
  
  Passage (interactive/emacs):
    passage list     // list all entries
    passage show     // decrypt and display
    passage insert   // add new secret
'''

packages = [
  "age",
  "age-plugin-yubikey",
  "jq",
  "rage",
  "passage",
  "ssh-to-age",
  "yubikey-manager",
]

[[commands]]
name = "list-secrets"
help = "lists all agenix secrets and their encryption status"
category = "agenix"
command = '''
  echo "Agenix Secrets (NixOS-deployed):"
  echo
  printf "%-55s %s\n" "SECRET" "STATUS"
  printf "%-55s %s\n" "------" "------"
  
  # Find all .age files in agenix/
  find agenix -name "*.age" -type f 2>/dev/null | sort | while read -r secret; do
    printf "%-55s ✓ encrypted\n" "$secret"
  done
  
  # Check secrets.nix for any defined but missing
  if [ -f secrets.nix ]; then
    echo
    missing=0
    while read -r expected; do
      if [ ! -f "$expected" ]; then
        if [ $missing -eq 0 ]; then
          echo "Defined in secrets.nix but missing:"
        fi
        echo "  ✗ $expected"
        missing=$((missing + 1))
      fi
    done < <(grep -o '"[^"]*\.age"' secrets.nix | tr -d '"')
  fi
  
  echo
  echo "Passage Store (interactive/emacs):"
  echo
  find passage-store -name "*.age" -type f 2>/dev/null | sort | while read -r secret; do
    # Strip passage-store/ prefix for display
    entry="${secret#passage-store/}"
    entry="${entry%.age}"
    printf "  %s\n" "$entry"
  done
'''

[[commands]]
name = "view-secret"
help = "decrypts and prints an agenix secret (usage: view-secret <path>)"
category = "agenix"
command = '''
  if [ -z "$1" ]; then
    echo "Usage: view-secret <secret-path>"
    echo
    echo "Available agenix secrets:"
    find agenix -name "*.age" -type f | sort | sed 's/^/  /'
    echo
    echo "For passage secrets, use: passage show <entry>"
    exit 1
  fi
  
  if [ ! -f "$1" ]; then
    echo "Error: Secret '$1' not found"
    exit 1
  fi
  
  rage -d -i ~/.ssh/id_ed25519 -i ~/.ssh/id_ed25519_b7r6 "$1" 2>/dev/null || \
    echo "Failed to decrypt (do you have the right key?)"
'''

[[commands]]
name = "edit-secret"
help = "edits an agenix secret in-place (usage: edit-secret <path>)"
category = "agenix"
command = '''
  if [ -z "$1" ]; then
    echo "Usage: edit-secret <secret-path>"
    echo
    echo "Available agenix secrets:"
    find agenix -name "*.age" -type f | sort | sed 's/^/  /'
    exit 1
  fi
  
  if [ ! -f "$1" ]; then
    echo "Error: Secret '$1' not found"
    exit 1
  fi
  
  agenix -e "$1"
'''

[[commands]]
name = "new-agenix-secret"
help = "create a new agenix secret (usage: new-agenix-secret <path>)"
category = "agenix"
command = '''
  if [ -z "$1" ]; then
    echo "Usage: new-agenix-secret <path>"
    echo
    echo "Examples:"
    echo "  new-agenix-secret agenix/machines/some-key.age"
    echo "  new-agenix-secret agenix/users/b7r6/some-key.age"
    echo
    echo "Don't forget to add it to secrets.nix!"
    exit 1
  fi
  
  if [ -f "$1" ]; then
    echo "Error: Secret '$1' already exists"
    echo "Use edit-secret to modify it"
    exit 1
  fi
  
  mkdir -p "$(dirname "$1")"
  agenix -e "$1"
  echo "✓ Created $1"
  echo
  echo "Remember to add to secrets.nix:"
  echo "  \"$1\".publicKeys = b7r6Everywhere;"
'''

[[commands]]
name = "rekey-secrets"
help = "re-encrypts all agenix secrets with current keys from secrets.nix"
category = "agenix"
command = "agenix -r && echo '✓ All agenix secrets rekeyed'"

[[commands]]
name = "validate-secrets"
help = "validate all secrets can be decrypted"
category = "agenix"
command = '''
  echo "Validating agenix secrets..."
  errors=0
  
  find agenix -name "*.age" -type f | sort | while read -r secret; do
    if rage -d -i ~/.ssh/id_ed25519 -i ~/.ssh/id_ed25519_b7r6 "$secret" > /dev/null 2>&1; then
      echo "✓ $secret"
    else
      echo "✗ $secret (failed to decrypt)"
      errors=$((errors + 1))
    fi
  done
  
  echo
  echo "Validating passage secrets..."
  find passage-store -name "*.age" -type f | sort | while read -r secret; do
    if rage -d -i ~/.ssh/id_ed25519 -i ~/.ssh/id_ed25519_b7r6 "$secret" > /dev/null 2>&1; then
      echo "✓ $secret"
    else
      echo "✗ $secret (failed to decrypt)"
      errors=$((errors + 1))
    fi
  done
  
  if [ $errors -eq 0 ]; then
    echo
    echo "✓ All secrets valid"
  else
    echo
    echo "✗ $errors secrets failed validation"
    exit 1
  fi
'''

[[commands]]
name = "scan-host-key"
help = "get SSH host key for a machine (usage: scan-host-key <hostname>)"
category = "keys"
command = '''
  if [ -z "$1" ]; then
    echo "Usage: scan-host-key <hostname>"
    echo
    echo "Add the output to keys.nix under hosts.<hostname>"
    exit 1
  fi
  
  echo "Scanning $1 for ed25519 host key..."
  key=$(ssh-keyscan -t ed25519 "$1" 2>/dev/null | cut -d' ' -f2-)
  
  if [ -z "$key" ]; then
    echo "Failed to get host key. Is the host reachable?"
    exit 1
  fi
  
  echo
  echo "Add to keys.nix:"
  echo
  echo "    $1 = ["
  echo "      \"$key\""
  echo "    ];"
'''

[[commands]]
name = "init-passage"
help = "initialize passage identities file"
category = "passage"
command = '''
  mkdir -p ~/.passage
  : > ~/.passage/identities
  
  for key in ~/.ssh/id_ed25519 ~/.ssh/id_ed25519_b7r6; do
    if [ -f "$key" ]; then
      echo "$key" >> ~/.passage/identities
      echo "Added $key"
    fi
  done
  
  echo
  echo "✓ Passage identities configured"
  echo "  PASSAGE_DIR should point to: $(pwd)/passage-store"
'''
