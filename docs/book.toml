[book]
title = "// hypermodern // nixos"
authors = ["b7r6"]
description = "Operator + architecture documentation for the hypermodern NixOS fleet."
src = "src"
language = "en"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "ayu"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/b7r6/nixos-config"
edit-url-template = "https://github.com/b7r6/nixos-config/edit/main/docs/{path}"
no-section-label = false

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
