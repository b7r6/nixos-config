<svg width="3840" height="2800" viewBox="0 0 3840 2800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;400;500;700&amp;display=swap');
      .mono { font-family: 'Berkeley Mono', 'JetBrains Mono', 'Fira Code', monospace; }
      .display { font-family: 'Berkeley Mono', 'JetBrains Mono', monospace; font-weight: 200; }
    </style>
    <linearGradient id="trustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0969da;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#54aeff;stop-opacity:0.05" />
    </linearGradient>
    <pattern id="hexGrid" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,0 45,26 30,52 15,26" fill="none" stroke="#54aeff" stroke-width="0.25" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="3840" height="2800" fill="#111417"/>
  
  <!-- Hex grid overlay -->
  <rect width="3840" height="2800" fill="url(#hexGrid)"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="3840" height="120" fill="url(#trustGrad)"/>
  <text x="60" y="70" class="display" fill="#54aeff" font-size="42" font-weight="200">HYPER // MODERN // TRUST COMPILER</text>
  <text x="60" y="100" class="display" fill="#596775" font-size="16">REPRODUCIBLE BUILDS FOR UNREPRODUCIBLE TIMES</text>
  
  <!-- Trust Chain Visualization -->
  <g transform="translate(60, 180)">
    <text x="0" y="0" class="display" fill="#80ccff" font-size="24">TRUST CHAIN</text>
    
    <g transform="translate(0, 60)">
      <!-- Traditional chain -->
      <text x="0" y="0" class="display" fill="#596775" font-size="14">TRADITIONAL:</text>
      <rect x="0" y="20" width="200" height="60" fill="#2b323a" stroke="#596775"/>
      <text x="100" y="55" class="mono" fill="#d8e0e7" font-size="12" text-anchor="middle">glibc.so</text>
      
      <path d="M 210 50 L 250 50" stroke="#596775" stroke-width="2" marker-end="url(#arrow)"/>
      
      <rect x="260" y="20" width="200" height="60" fill="#2b323a" stroke="#596775"/>
      <text x="360" y="55" class="mono" fill="#d8e0e7" font-size="12" text-anchor="middle">openssl.so</text>
      
      <path d="M 470 50 L 510 50" stroke="#596775" stroke-width="2"/>
      
      <rect x="520" y="20" width="200" height="60" fill="#2b323a" stroke="#596775"/>
      <text x="620" y="45" class="mono" fill="#d8e0e7" font-size="12" text-anchor="middle">your app</text>
      <text x="620" y="65" class="mono" fill="#b6e3ff" font-size="10" text-anchor="middle">(compromised)</text>
    </g>
    
    <g transform="translate(0, 180)">
      <!-- Nix chain -->
      <text x="0" y="0" class="display" fill="#596775" font-size="14">HYPERMODERN:</text>
      <rect x="0" y="20" width="200" height="60" fill="#181c21" stroke="#54aeff"/>
      <text x="100" y="55" class="mono" fill="#80ccff" font-size="12" text-anchor="middle">musl-libc</text>
      
      <path d="M 210 50 L 250 50" stroke="#54aeff" stroke-width="2"/>
      
      <rect x="260" y="20" width="200" height="60" fill="#181c21" stroke="#54aeff"/>
      <text x="360" y="55" class="mono" fill="#80ccff" font-size="12" text-anchor="middle">libressl</text>
      
      <path d="M 470 50 L 510 50" stroke="#54aeff" stroke-width="2"/>
      
      <rect x="520" y="20" width="200" height="60" fill="#181c21" stroke="#54aeff"/>
      <text x="620" y="45" class="mono" fill="#80ccff" font-size="12" text-anchor="middle">your app</text>
      <text x="620" y="65" class="mono" fill="#54aeff" font-size="10" text-anchor="middle">(deterministic)</text>
    </g>
  </g>
  
  <!-- Code Example -->
  <g transform="translate(900, 180)">
    <text x="0" y="0" class="display" fill="#80ccff" font-size="24">BUILD MANIFEST</text>
    
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="800" height="500" fill="#181c21" stroke="#21262d" stroke-width="1"/>
      
      <text x="20" y="40" class="mono" fill="#596775" font-size="14"># nixpkgs as trust compiler</text>
      <text x="20" y="65" class="mono" fill="#d8e0e7" font-size="14">{</text>
      <text x="40" y="90" class="mono" fill="#80ccff" font-size="14">mkDerivation</text>
      <text x="140" y="90" class="mono" fill="#d8e0e7" font-size="14">rec {</text>
      
      <text x="60" y="115" class="mono" fill="#d8e0e7" font-size="14">name = </text>
      <text x="120" y="115" class="mono" fill="#218bff" font-size="14">"libsodium-static"</text>
      <text x="280" y="115" class="mono" fill="#d8e0e7" font-size="14">;</text>
      
      <text x="60" y="140" class="mono" fill="#596775" font-size="14"># no dlopen, no surprises</text>
      <text x="60" y="165" class="mono" fill="#d8e0e7" font-size="14">configureFlags = [</text>
      <text x="80" y="190" class="mono" fill="#218bff" font-size="14">"--enable-static"</text>
      <text x="80" y="215" class="mono" fill="#218bff" font-size="14">"--disable-shared"</text>
      <text x="80" y="240" class="mono" fill="#218bff" font-size="14">"--disable-dependency-tracking"</text>
      <text x="60" y="265" class="mono" fill="#d8e0e7" font-size="14">];</text>
      
      <text x="60" y="315" class="mono" fill="#596775" font-size="14"># reproducible by construction</text>
      <text x="60" y="340" class="mono" fill="#d8e0e7" font-size="14">outputs = [ </text>
      <text x="160" y="340" class="mono" fill="#218bff" font-size="14">"out"</text>
      <text x="210" y="340" class="mono" fill="#218bff" font-size="14">"dev"</text>
      <text x="260" y="340" class="mono" fill="#d8e0e7" font-size="14">];</text>
      
      <text x="60" y="390" class="mono" fill="#d8e0e7" font-size="14">meta.platforms = </text>
      <text x="200" y="390" class="mono" fill="#80ccff" font-size="14">lib</text>
      <text x="230" y="390" class="mono" fill="#d8e0e7" font-size="14">.platforms.all;</text>
      
      <text x="40" y="415" class="mono" fill="#d8e0e7" font-size="14">};</text>
      <text x="20" y="440" class="mono" fill="#d8e0e7" font-size="14">}</text>
    </g>
  </g>
  
  <!-- Ubuntu Package Generation -->
  <g transform="translate(1800, 180)">
    <text x="0" y="0" class="display" fill="#80ccff" font-size="24">DEB OUTPUT</text>
    
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="600" height="400" fill="#181c21" stroke="#21262d" stroke-width="1"/>
      
      <text x="20" y="40" class="mono" fill="#596775" font-size="14"># clean .deb generation</text>
      <text x="20" y="65" class="mono" fill="#80ccff" font-size="14">nix-build</text>
      <text x="110" y="65" class="mono" fill="#d8e0e7" font-size="14">-A libsodium-deb</text>
      
      <text x="20" y="110" class="mono" fill="#596775" font-size="14"># package info</text>
      <text x="20" y="135" class="mono" fill="#d8e0e7" font-size="14">Package: libsodium23</text>
      <text x="20" y="160" class="mono" fill="#d8e0e7" font-size="14">Version: 1.0.18-nix</text>
      <text x="20" y="185" class="mono" fill="#d8e0e7" font-size="14">Architecture: amd64</text>
      <text x="20" y="210" class="mono" fill="#d8e0e7" font-size="14">Depends: </text>
      <text x="100" y="210" class="mono" fill="#54aeff" font-size="14">none</text>
      <text x="150" y="210" class="mono" fill="#596775" font-size="14"># statically linked</text>
      
      <text x="20" y="255" class="mono" fill="#596775" font-size="14"># verification</text>
      <text x="20" y="280" class="mono" fill="#d8e0e7" font-size="14">$ ldd /usr/lib/libsodium.so.23</text>
      <text x="40" y="305" class="mono" fill="#54aeff" font-size="14">not a dynamic executable</text>
      
      <text x="20" y="350" class="mono" fill="#d8e0e7" font-size="14">$ strings libsodium.so.23 | grep -E "(phone|home|track)"</text>
      <text x="40" y="375" class="mono" fill="#54aeff" font-size="14"># no results</text>
    </g>
  </g>
  
  <!-- Philosophy -->
  <g transform="translate(60, 800)">
    <text x="0" y="0" class="display" fill="#80ccff" font-size="24">PRINCIPLES</text>
    
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="1200" height="300" fill="#181c21" stroke="#21262d" stroke-width="1"/>
      
      <text x="40" y="40" class="display" fill="#54aeff" font-size="18">1. TRUST NOTHING</text>
      <text x="60" y="70" class="mono" fill="#d8e0e7" font-size="14">every binary is guilty until proven deterministic</text>
      
      <text x="40" y="120" class="display" fill="#54aeff" font-size="18">2. VERIFY EVERYTHING</text>
      <text x="60" y="150" class="mono" fill="#d8e0e7" font-size="14">if it dlopens nslookup, it's calling home</text>
      
      <text x="40" y="200" class="display" fill="#54aeff" font-size="18">3. STATIC > DYNAMIC</text>
      <text x="60" y="230" class="mono" fill="#d8e0e7" font-size="14">what you link is what you get</text>
    </g>
  </g>
  
  <!-- Quote -->
  <g transform="translate(60, 1200)">
    <rect x="0" y="0" width="1600" height="120" fill="#181c21" stroke="#54aeff" stroke-width="1"/>
    <text x="40" y="50" class="mono" fill="#80ccff" font-size="16" font-style="italic">
      "You can't trust code that you did not totally create yourself."
    </text>
    <text x="40" y="80" class="mono" fill="#596775" font-size="14">
      - Ken Thompson, "Reflections on Trusting Trust"
    </text>
  </g>
  
  <!-- Bottom banner -->
  <g transform="translate(60, 1400)">
    <text x="0" y="0" class="display" fill="#54aeff" font-size="64" font-weight="200">HYPER // MODERN</text>
    <text x="0" y="50" class="display" fill="#596775" font-size="18">USING NIX TO BUILD TRUST INTO UNTRUSTED SYSTEMS</text>
    
    <text x="0" y="120" class="mono" fill="#d8e0e7" font-size="14">
      github.com/hypermodern-src/nixos
    </text>
  </g>
  
  <!-- Glitch effect on title -->
  <g transform="translate(62, 1402)" opacity="0.5">
    <text x="0" y="0" class="display" fill="#0969da" font-size="64" font-weight="200">HYPER // MODERN</text>
    <animate attributeName="transform" 
             values="translate(62, 1402);translate(58, 1398);translate(62, 1402)" 
             dur="0.1s" 
             repeatCount="indefinite"/>
  </g>
</svg>
