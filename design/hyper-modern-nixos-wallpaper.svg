<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&amp;display=swap');
      .mono { font-family: 'Fira Code', 'Berkeley Mono', monospace; }
    </style>
  </defs>
  
  <!-- Chiba palette for variety -->
  <!-- base00: #090b0e, base04: #596775, base0A: #54aeff, base09: #80ccff, base0B: #218bff -->
  
  <!-- Background -->
  <rect width="2560" height="1440" fill="#090b0e"/>
  
  <!-- Complex perSystem module - top left, HIGH CONTRAST -->
  <g transform="translate(60, 60)" opacity="0.7">
    <text x="0" y="0" class="mono" fill="#80ccff" font-size="12" font-weight="500">
      <tspan x="0" dy="0">[nixos@razorgirl:~/psv4]$ cat nix/modules/psv4.nix</tspan>
    </text>
    <text x="0" y="18" class="mono" fill="#596775" font-size="12" font-weight="400">
      <tspan x="0" dy="18">{ <tspan fill="#b6e3ff">config</tspan>, <tspan fill="#b6e3ff">lib</tspan>, <tspan fill="#b6e3ff">flake-parts-lib</tspan>, ... }:</tspan>
      <tspan x="0" dy="18"><tspan fill="#54aeff" font-weight="600">let</tspan></tspan>
      <tspan x="0" dy="18">  <tspan fill="#54aeff">inherit</tspan> (lib) mkOption types;</tspan>
      <tspan x="0" dy="18">  <tspan fill="#54aeff">inherit</tspan> (flake-parts-lib) mkPerSystemOption;</tspan>
      <tspan x="0" dy="18"><tspan fill="#54aeff" font-weight="600">in</tspan> {</tspan>
      <tspan x="0" dy="18">  options.perSystem = mkPerSystemOption ({ <tspan fill="#b6e3ff">config</tspan>, <tspan fill="#b6e3ff">pkgs</tspan>, ... }: {</tspan>
      <tspan x="0" dy="18">    psv4 = {</tspan>
      <tspan x="0" dy="18">      theme = mkOption {</tspan>
      <tspan x="0" dy="18">        type = types.enum [ <tspan fill="#218bff">"razorgirl"</tspan> <tspan fill="#218bff">"razorgirl"</tspan> <tspan fill="#218bff">"sprawl"</tspan> ];</tspan>
      <tspan x="0" dy="18">        default = <tspan fill="#218bff">"razorgirl"</tspan>;</tspan>
      <tspan x="0" dy="18">      };</tspan>
      <tspan x="0" dy="18">      </tspan>
      <tspan x="0" dy="18">      packages = mkOption {</tspan>
      <tspan x="0" dy="18">        type = types.attrsOf types.package;</tspan>
      <tspan x="0" dy="18">        default = {};</tspan>
      <tspan x="0" dy="18">      };</tspan>
      <tspan x="0" dy="18">    };</tspan>
      <tspan x="0" dy="18">  });</tspan>
      <tspan x="0" dy="18">  </tspan>
      <tspan x="0" dy="18">  config.perSystem = { <tspan fill="#b6e3ff">config</tspan>, <tspan fill="#b6e3ff">pkgs</tspan>, ... }: {</tspan>
      <tspan x="0" dy="18">    psv4.packages = {</tspan>
      <tspan x="0" dy="18">      theme = pkgs.callPackage ./theme.nix {</tspan>
      <tspan x="0" dy="18">        themeName = config.psv4.theme;</tspan>
      <tspan x="0" dy="18">      };</tspan>
      <tspan x="0" dy="18">    };</tspan>
      <tspan x="0" dy="18">  };</tspan>
      <tspan x="0" dy="18">}</tspan>
    </text>
  </g>
  
  <!-- Nix store paths visualization - top right, PUNCHY -->
  <g transform="translate(2300, 60)" opacity="0.6">
    <text x="0" y="0" class="mono" fill="#80ccff" font-size="11" font-weight="500" text-anchor="end">
      <tspan x="0" dy="0">STORE::DERIVATIONS</tspan>
    </text>
    <text x="0" y="14" class="mono" fill="#596775" font-size="10" font-weight="400" text-anchor="end">
      <tspan x="0" dy="14">━━━━━━━━━━━━━━━━━━━━━━</tspan>
      <tspan x="0" dy="14" fill="#54aeff" font-weight="600">/nix/store/x7q9...f3p2</tspan>
      <tspan x="0" dy="14">  └─ psv4-0.1.0</tspan>
      <tspan x="0" dy="14" fill="#54aeff" font-weight="600">/nix/store/b8n4...2k1x</tspan>
      <tspan x="0" dy="14">  └─ razorgirl-theme</tspan>
      <tspan x="0" dy="14" fill="#54aeff" font-weight="600">/nix/store/m3d8...9pq7</tspan>
      <tspan x="0" dy="14">  └─ berkeley-mono</tspan>
      <tspan x="0" dy="14">━━━━━━━━━━━━━━━━━━━━━━</tspan>
      <tspan x="0" dy="14" fill="#b6e3ff" font-weight="500">total: 12,847 paths</tspan>
      <tspan x="0" dy="14" fill="#b6e3ff" font-weight="500">size: 184.2 GiB</tspan>
      <tspan x="0" dy="14">━━━━━━━━━━━━━━━━━━━━━━</tspan>
    </text>
  </g>
  
  <!-- Main statement - lower left, BOLD AND BRIGHT -->
  <g transform="translate(120, 1200)">
    <text x="0" y="0" class="mono" font-size="86" font-weight="500">
      <tspan fill="#54aeff" font-weight="700">//</tspan>
      <tspan fill="#b6e3ff" dx="24">HYPER</tspan>
      <tspan fill="#54aeff" font-weight="700" dx="24">//</tspan>
      <tspan fill="#b6e3ff" dx="24">MODERN</tspan>
      <tspan fill="#54aeff" font-weight="700" dx="24">//</tspan>
      <tspan fill="#b6e3ff" dx="24">NIXOS</tspan>
    </text>
  </g>
  
  <!-- Flake evaluation output - bottom right, VISIBLE -->
  <g transform="translate(2300, 1280)" opacity="0.5">
    <text x="0" y="0" class="mono" fill="#596775" font-size="11" font-weight="400" text-anchor="end">
      <tspan x="0" dy="0" fill="#80ccff">$ nix flake check</tspan>
      <tspan x="0" dy="14" fill="#54aeff">✓ packages.x86_64-linux.psv4</tspan>
      <tspan x="0" dy="14" fill="#54aeff">✓ devShells.x86_64-linux.default</tspan>
      <tspan x="0" dy="14" fill="#54aeff">✓ nixosConfigurations.razorgirl</tspan>
      <tspan x="0" dy="14" fill="#54aeff">✓ formatter.x86_64-linux</tspan>
      <tspan x="0" dy="14" fill="#596775">evaluation completed in 2.41s</tspan>
    </text>
  </g>
  
  <!-- Command being typed - MORE PROMINENT -->
  <g transform="translate(900, 600)" opacity="0.4">
    <text x="0" y="0" class="mono" fill="#b6e3ff" font-size="18" font-weight="600">
      <tspan x="0" dy="0">$ nix run .#psv4 -- --theme razorgirl</tspan>
    </text>
    <rect x="590" y="-16" width="12" height="24" fill="#54aeff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Subtle accent line -->
  <rect x="100" y="1100" width="1400" height="1" fill="#54aeff" opacity="0.15"/>
</svg>
