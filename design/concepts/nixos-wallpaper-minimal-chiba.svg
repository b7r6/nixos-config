<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>
  
  <!-- Chiba palette -->
  <!-- base00: #090b0e, base04: #596775, base0A: #54aeff, base0C: #0969da -->
  
  <!-- Background -->
  <rect width="2560" height="1440" fill="#090b0e"/>
  
  <!-- Minimal terminal trace in corner -->
  <g transform="translate(2300, 1340)" opacity="0.15">
    <text x="0" y="0" class="mono" fill="#596775" font-size="10" font-weight="300" text-anchor="end">
      <tspan x="0" dy="0">generation 247 / chiba</tspan>
      <tspan x="0" dy="14">kernel: 6.1.0</tspan>
      <tspan x="0" dy="14">uptime: 14d 3h 27m</tspan>
    </text>
  </g>
  
  <!-- Single statement -->
  <g transform="translate(1280, 720)">
    <text x="0" y="0" class="mono" fill="#54aeff" font-size="200" font-weight="300" text-anchor="middle">//</text>
    <text x="-180" y="0" class="mono" fill="#596775" font-size="60" font-weight="600" text-anchor="middle">nix</text>
    <text x="180" y="0" class="mono" fill="#596775" font-size="60" font-weight="600" text-anchor="middle">os</text>
  </g>
  
  <!-- Minimal accent -->
  <rect x="1180" y="850" width="200" height="1" fill="#54aeff" opacity="0.3"/>
</svg>