<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&amp;family=Aldrich&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Berkeley Mono', monospace; }
      .display { font-family: 'Aldrich', 'JetBrains Mono', monospace; }
    </style>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0969da;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#54aeff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="2560" height="1440" fill="#111417"/>
  
  <!-- Subtle grid -->
  <g opacity="0.03">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="none" stroke="#54aeff" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect width="2560" height="1440" fill="url(#grid)"/>
  </g>
  
  <!-- Header -->
  <rect x="0" y="0" width="2560" height="120" fill="url(#blueGrad)"/>
  <text x="60" y="70" class="display" fill="#54aeff" font-size="48" font-weight="400">// ONO-SENDAI RAZORGIRL</text>
  <text x="60" y="100" class="mono" fill="#596775" font-size="16">HYPER MODERN BASE16 THEME</text>
  
  <!-- Color Palette Section -->
  <g transform="translate(60, 180)">
    <text x="0" y="0" class="display" fill="#80ccff" font-size="24">COLOR SYSTEM</text>
    
    <!-- Base colors -->
    <g transform="translate(0, 40)">
      <!-- Row 1: Dark backgrounds -->
      <g>
        <rect x="0" y="0" width="140" height="140" fill="#111417" stroke="#21262d" stroke-width="1"/>
        <text x="70" y="70" class="mono" fill="#d8e0e7" font-size="14" text-anchor="middle">base00</text>
        <text x="70" y="90" class="mono" fill="#596775" font-size="12" text-anchor="middle">#111417</text>
        <text x="70" y="110" class="mono" fill="#596775" font-size="10" text-anchor="middle">L=8%</text>
      </g>
      
      <g transform="translate(160, 0)">
        <rect x="0" y="0" width="140" height="140" fill="#181c21" stroke="#21262d" stroke-width="1"/>
        <text x="70" y="70" class="mono" fill="#d8e0e7" font-size="14" text-anchor="middle">base01</text>
        <text x="70" y="90" class="mono" fill="#596775" font-size="12" text-anchor="middle">#181c21</text>
        <text x="70" y="110" class="mono" fill="#596775" font-size="10" text-anchor="middle">L=11%</text>
      </g>
      
      <g transform="translate(320, 0)">
        <rect x="0" y="0" width="140" height="140" fill="#21262d" stroke="#2b323a" stroke-width="1"/>
        <text x="70" y="70" class="mono" fill="#d8e0e7" font-size="14" text-anchor="middle">base02</text>
        <text x="70" y="90" class="mono" fill="#596775" font-size="12" text-anchor="middle">#21262d</text>
        <text x="70" y="110" class="mono" fill="#596775" font-size="10" text-anchor="middle">L=15%</text>
      </g>
      
      <g transform="translate(480, 0)">
        <rect x="0" y="0" width="140" height="140" fill="#2b323a" stroke="#596775" stroke-width="1"/>
        <text x="70" y="70" class="mono" fill="#d8e0e7" font-size="14" text-anchor="middle">base03</text>
        <text x="70" y="90" class="mono" fill="#80ccff" font-size="12" text-anchor="middle">#2b323a</text>
        <text x="70" y="110" class="mono" fill="#596775" font-size="10" text-anchor="middle">L=19%</text>
      </g>
    </g>
    
    <!-- Row 2: Mid tones -->
    <g transform="translate(0, 160)">
      <g>
        <rect x="0" y="0" width="140" height="140" fill="#596775" stroke="#80ccff" stroke-width="1"/>
        <text x="70" y="70" class="mono" fill="#181c21" font-size="14" text-anchor="middle">base04</text>
        <text x="70" y="90" class="mono" fill="#181c21" font-size="12" text-anchor="middle">#596775</text>
      </g>
      
      <g transform="translate(160, 0)">
        <rect x="0" y="0" width="140" height="140" fill="#d8e0e7" stroke="#80ccff" stroke-width="1"/>
        <text x="70" y="70" class="mono" fill="#181c21" font-size="14" text-anchor="middle">base05</text>
        <text x="70" y="90" class="mono" fill="#181c21" font-size="12" text-anchor="middle">#d8e0e7</text>
      </g>
      
      <g transform="translate(320, 0)">
        <rect x="0" y="0" width="140" height="140" fill="#ddf4ff" stroke="#80ccff" stroke-width="1"/>
        <text x="70" y="70" class="mono" fill="#181c21" font-size="14" text-anchor="middle">base06</text>
        <text x="70" y="90" class="mono" fill="#181c21" font-size="12" text-anchor="middle">#ddf4ff</text>
      </g>
      
      <g transform="translate(480, 0)">
        <rect x="0" y="0" width="140" height="140" fill="#e6f7ff" stroke="#80ccff" stroke-width="1"/>
        <text x="70" y="70" class="mono" fill="#181c21" font-size="14" text-anchor="middle">base07</text>
        <text x="70" y="90" class="mono" fill="#181c21" font-size="12" text-anchor="middle">#e6f7ff</text>
      </g>
    </g>
    
    <!-- Row 3: Accent colors -->
    <g transform="translate(0, 320)">
      <g>
        <rect x="0" y="0" width="140" height="140" fill="#b6e3ff"/>
        <text x="70" y="70" class="mono" fill="#181c21" font-size="14" text-anchor="middle">base08</text>
        <text x="70" y="90" class="mono" fill="#181c21" font-size="12" text-anchor="middle">#b6e3ff</text>
        <text x="70" y="110" class="mono" fill="#181c21" font-size="10" text-anchor="middle">ice</text>
      </g>
      
      <g transform="translate(160, 0)">
        <rect x="0" y="0" width="140" height="140" fill="#80ccff"/>
        <text x="70" y="70" class="mono" fill="#181c21" font-size="14" text-anchor="middle">base09</text>
        <text x="70" y="90" class="mono" fill="#181c21" font-size="12" text-anchor="middle">#80ccff</text>
        <text x="70" y="110" class="mono" fill="#181c21" font-size="10" text-anchor="middle">sky</text>
      </g>
      
      <g transform="translate(320, 0)">
        <rect x="0" y="0" width="140" height="140" fill="#54aeff"/>
        <rect x="0" y="0" width="140" height="140" fill="none" stroke="#ddf4ff" stroke-width="3"/>
        <text x="70" y="70" class="mono" fill="#181c21" font-size="14" font-weight="700" text-anchor="middle">base0A</text>
        <text x="70" y="90" class="mono" fill="#181c21" font-size="12" font-weight="700" text-anchor="middle">#54aeff</text>
        <text x="70" y="110" class="mono" fill="#181c21" font-size="10" font-weight="700" text-anchor="middle">HERO</text>
      </g>
      
      <g transform="translate(480, 0)">
        <rect x="0" y="0" width="140" height="140" fill="#218bff"/>
        <text x="70" y="70" class="mono" fill="#ddf4ff" font-size="14" text-anchor="middle">base0B</text>
        <text x="70" y="90" class="mono" fill="#ddf4ff" font-size="12" text-anchor="middle">#218bff</text>
        <text x="70" y="110" class="mono" fill="#ddf4ff" font-size="10" text-anchor="middle">deep</text>
      </g>
    </g>
    
    <!-- Row 4: More accents -->
    <g transform="translate(0, 480)">
      <g>
        <rect x="0" y="0" width="140" height="140" fill="#0969da"/>
        <text x="70" y="70" class="mono" fill="#ddf4ff" font-size="14" text-anchor="middle">base0C</text>
        <text x="70" y="90" class="mono" fill="#ddf4ff" font-size="12" text-anchor="middle">#0969da</text>
        <text x="70" y="110" class="mono" fill="#ddf4ff" font-size="10" text-anchor="middle">matrix</text>
      </g>
      
      <g transform="translate(160, 0)">
        <rect x="0" y="0" width="140" height="140" fill="#4d9fff"/>
        <text x="70" y="70" class="mono" fill="#181c21" font-size="14" text-anchor="middle">base0D</text>
        <text x="70" y="90" class="mono" fill="#181c21" font-size="12" text-anchor="middle">#4d9fff</text>
        <text x="70" y="110" class="mono" fill="#181c21" font-size="10" text-anchor="middle">link</text>
      </g>
      
      <g transform="translate(320, 0)">
        <rect x="0" y="0" width="140" height="140" fill="#6cb6ff"/>
        <text x="70" y="70" class="mono" fill="#181c21" font-size="14" text-anchor="middle">base0E</text>
        <text x="70" y="90" class="mono" fill="#181c21" font-size="12" text-anchor="middle">#6cb6ff</text>
        <text x="70" y="110" class="mono" fill="#181c21" font-size="10" text-anchor="middle">soft</text>
      </g>
      
      <g transform="translate(480, 0)">
        <rect x="0" y="0" width="140" height="140" fill="#1f6feb"/>
        <text x="70" y="70" class="mono" fill="#ddf4ff" font-size="14" text-anchor="middle">base0F</text>
        <text x="70" y="90" class="mono" fill="#ddf4ff" font-size="12" text-anchor="middle">#1f6feb</text>
        <text x="70" y="110" class="mono" fill="#ddf4ff" font-size="10" text-anchor="middle">corp</text>
      </g>
    </g>
  </g>
  
  <!-- Typography Examples -->
  <g transform="translate(780, 180)">
    <text x="0" y="0" class="display" fill="#80ccff" font-size="24">TYPOGRAPHY</text>
    
    <!-- Weight scale -->
    <g transform="translate(0, 50)">
      <text x="0" y="0" class="mono" fill="#54aeff" font-size="20" font-weight="300">JetBrains Mono Light 300</text>
      <text x="0" y="35" class="mono" fill="#54aeff" font-size="20" font-weight="400">JetBrains Mono Regular 400</text>
      <text x="0" y="70" class="mono" fill="#54aeff" font-size="20" font-weight="500">JetBrains Mono Medium 500</text>
      <text x="0" y="105" class="mono" fill="#54aeff" font-size="20" font-weight="600">JetBrains Mono SemiBold 600</text>
      <text x="0" y="140" class="mono" fill="#54aeff" font-size="20" font-weight="700">JetBrains Mono Bold 700</text>
      <text x="0" y="175" class="mono" fill="#54aeff" font-size="20" font-weight="800">JetBrains Mono ExtraBold 800</text>
    </g>
    
    <!-- Logo applications -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="400" height="80" fill="#181c21"/>
      <rect x="0" y="0" width="4" height="80" fill="#54aeff"/>
      <rect x="396" y="0" width="4" height="80" fill="#54aeff"/>
      <text x="20" y="45" class="mono" fill="#80ccff" font-size="28" font-weight="600">//</text>
      <text x="70" y="45" class="mono" fill="#d8e0e7" font-size="28" font-weight="700">psv4 --init</text>
      <rect x="290" y="50" width="60" height="4" fill="#b6e3ff" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0;0.8" dur="1.5s" repeatCount="indefinite"/>
      </rect>
    </g>
    
    <g transform="translate(0, 380)">
      <rect x="0" y="0" width="400" height="80" fill="#181c21"/>
      <rect x="0" y="0" width="4" height="80" fill="#0969da"/>
      <rect x="396" y="0" width="4" height="80" fill="#0969da"/>
      <text x="20" y="45" class="mono" fill="#80ccff" font-size="28" font-weight="600">//</text>
      <text x="70" y="45" class="mono" fill="#d8e0e7" font-size="28" font-weight="700">psv4:razorgirl</text>
    </g>
    
    <g transform="translate(0, 480)">
      <rect x="0" y="0" width="400" height="80" fill="#181c21"/>
      <rect x="0" y="0" width="4" height="80" fill="#218bff"/>
      <rect x="396" y="0" width="4" height="80" fill="#218bff"/>
      <text x="20" y="45" class="mono" fill="#80ccff" font-size="28" font-weight="600">//</text>
      <text x="70" y="45" class="mono" fill="#d8e0e7" font-size="28" font-weight="700">stellarwind</text>
    </g>
  </g>
  
  <!-- Code Example -->
  <g transform="translate(1280, 180)">
    <text x="0" y="0" class="display" fill="#80ccff" font-size="24">CODE PREVIEW</text>
    
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="600" height="400" fill="#181c21" stroke="#21262d" stroke-width="1"/>
      
      <!-- Code sample -->
      <text x="20" y="40" class="mono" fill="#596775" font-size="14">// Ono-Sendai Razorgirl Theme</text>
      <text x="20" y="65" class="mono" fill="#6cb6ff" font-size="14" font-weight="600">interface</text>
      <text x="110" y="65" class="mono" fill="#54aeff" font-size="14">Theme</text>
      <text x="160" y="65" class="mono" fill="#d8e0e7" font-size="14">{</text>
      
      <text x="40" y="90" class="mono" fill="#d8e0e7" font-size="14">name:</text>
      <text x="90" y="90" class="mono" fill="#218bff" font-size="14">'razorgirl'</text>
      <text x="190" y="90" class="mono" fill="#d8e0e7" font-size="14">;</text>
      
      <text x="40" y="115" class="mono" fill="#d8e0e7" font-size="14">variant:</text>
      <text x="120" y="115" class="mono" fill="#218bff" font-size="14">'dark'</text>
      <text x="180" y="115" class="mono" fill="#d8e0e7" font-size="14">;</text>
      
      <text x="40" y="140" class="mono" fill="#d8e0e7" font-size="14">palette:</text>
      <text x="120" y="140" class="mono" fill="#d8e0e7" font-size="14">{</text>
      
      <text x="60" y="165" class="mono" fill="#d8e0e7" font-size="14">base00:</text>
      <text x="130" y="165" class="mono" fill="#218bff" font-size="14">'#111417'</text>
      <text x="220" y="165" class="mono" fill="#d8e0e7" font-size="14">;</text>
      <text x="250" y="165" class="mono" fill="#596775" font-size="14">// L=8%</text>
      
      <text x="60" y="190" class="mono" fill="#d8e0e7" font-size="14">base0A:</text>
      <text x="130" y="190" class="mono" fill="#218bff" font-size="14">'#54aeff'</text>
      <text x="220" y="190" class="mono" fill="#d8e0e7" font-size="14">;</text>
      <text x="250" y="190" class="mono" fill="#596775" font-size="14">// HERO</text>
      
      <text x="40" y="215" class="mono" fill="#d8e0e7" font-size="14">};</text>
      <text x="20" y="240" class="mono" fill="#d8e0e7" font-size="14">}</text>
      
      <text x="20" y="280" class="mono" fill="#6cb6ff" font-size="14" font-weight="600">const</text>
      <text x="70" y="280" class="mono" fill="#d8e0e7" font-size="14">apply =</text>
      <text x="140" y="280" class="mono" fill="#d8e0e7" font-size="14">(</text>
      <text x="150" y="280" class="mono" fill="#80ccff" font-size="14">theme</text>
      <text x="195" y="280" class="mono" fill="#d8e0e7" font-size="14">:</text>
      <text x="210" y="280" class="mono" fill="#54aeff" font-size="14">Theme</text>
      <text x="255" y="280" class="mono" fill="#d8e0e7" font-size="14">) =></text>
      <text x="295" y="280" class="mono" fill="#d8e0e7" font-size="14">{</text>
      
      <text x="40" y="305" class="mono" fill="#80ccff" font-size="14">console</text>
      <text x="100" y="305" class="mono" fill="#d8e0e7" font-size="14">.</text>
      <text x="110" y="305" class="mono" fill="#4d9fff" font-size="14">log</text>
      <text x="135" y="305" class="mono" fill="#d8e0e7" font-size="14">(</text>
      <text x="145" y="305" class="mono" fill="#218bff" font-size="14">`Applying ${</text>
      <text x="270" y="305" class="mono" fill="#80ccff" font-size="14">theme.name</text>
      <text x="360" y="305" class="mono" fill="#218bff" font-size="14">}`</text>
      <text x="375" y="305" class="mono" fill="#d8e0e7" font-size="14">);</text>
      
      <text x="20" y="330" class="mono" fill="#d8e0e7" font-size="14">};</text>
    </g>
  </g>
  
  <!-- Version info -->
  <g transform="translate(1280, 640)">
    <text x="0" y="0" class="display" fill="#80ccff" font-size="24">THEME INFO</text>
    
    <g transform="translate(0, 40)">
      <rect x="0" y="0" width="600" height="200" fill="#181c21" stroke="#21262d" stroke-width="1"/>
      
      <text x="20" y="30" class="mono" fill="#596775" font-size="12">NAME</text>
      <text x="20" y="50" class="mono" fill="#d8e0e7" font-size="16">Ono-Sendai Razorgirl</text>
      
      <text x="20" y="85" class="mono" fill="#596775" font-size="12">AUTHORS</text>
      <text x="20" y="105" class="mono" fill="#d8e0e7" font-size="16">b7r6 / opus-4</text>
      
      <text x="20" y="140" class="mono" fill="#596775" font-size="12">CHARACTERISTICS</text>
      <text x="20" y="160" class="mono" fill="#d8e0e7" font-size="14">• OLED-safe black (L=8%)</text>
      <text x="20" y="180" class="mono" fill="#d8e0e7" font-size="14">• Mathematically tuned HSL</text>
    </g>
  </g>
  
  <!-- Bottom text -->
  <text x="60" y="1380" class="display" fill="#54aeff" font-size="64" font-weight="400">HYPER // MODERN</text>
  <text x="60" y="1410" class="mono" fill="#596775" font-size="16">PARABOLIC SYSTEM V4</text>
</svg>