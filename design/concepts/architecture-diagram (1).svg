<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="800" height="500" fill="#0d1117" />
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#c9d1d9">Proposed Security Architecture</text>
  
  <!-- Cloud Providers -->
  <rect x="50" y="70" width="320" height="180" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2" />
  <text x="210" y="95" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#58a6ff">AWS Cloud</text>
  
  <rect x="430" y="70" width="320" height="180" rx="10" fill="#161b22" stroke="#7ee787" stroke-width="2" />
  <text x="590" y="95" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#7ee787">Current GCP Setup</text>
  
  <!-- AWS Components -->
  <!-- RDS -->
  <rect x="70" y="120" width="120" height="50" rx="5" fill="#21262d" stroke="#58a6ff" stroke-width="2" />
  <text x="130" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#58a6ff">Amazon RDS</text>
  
  <!-- Secrets Manager -->
  <rect x="230" y="120" width="120" height="50" rx="5" fill="#21262d" stroke="#58a6ff" stroke-width="2" />
  <text x="290" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#58a6ff">HCP Vault</text>
  
  <!-- Straylight Proxies -->
  <rect x="70" y="190" width="280" height="40" rx="5" fill="#21262d" stroke="#58a6ff" stroke-width="2" />
  <text x="210" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#58a6ff">Straylight Proxies</text>
  
  <!-- GCP Components -->
  <!-- Current DBs -->
  <rect x="450" y="120" width="120" height="50" rx="5" fill="#21262d" stroke="#7ee787" stroke-width="2" />
  <text x="510" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#7ee787">Current DBs</text>
  
  <!-- Current Proxies -->
  <rect x="610" y="120" width="120" height="50" rx="5" fill="#21262d" stroke="#7ee787" stroke-width="2" />
  <text x="670" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#7ee787">Legacy Proxies</text>
  
  <!-- Legacy VPNs -->
  <rect x="450" y="190" width="280" height="40" rx="5" fill="#21262d" stroke="#7ee787" stroke-width="2" />
  <text x="590" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#7ee787">WireGuard VPNs</text>
  
  <!-- Network Security Layer -->
  <rect x="50" y="280" width="700" height="70" rx="10" fill="#161b22" stroke="#f97583" stroke-width="2" />
  <text x="400" y="315" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#f97583">Tailscale Zero-Trust Network</text>
  
  <!-- Dev & Ops Layer -->
  <rect x="50" y="380" width="700" height="70" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2" />
  <text x="400" y="415" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#d2a8ff">Terraform Infrastructure as Code</text>
  
  <!-- Arrows -->
  <!-- Migration Arrows -->
  <line x1="570" y1="135" x2="200" y2="135" stroke="#f0883e" stroke-width="2" stroke-dasharray="5,5" />
  <polygon points="200,135 210,130 210,140" fill="#f0883e" />
  
  <line x1="570" y1="200" x2="360" y2="200" stroke="#f0883e" stroke-width="2" stroke-dasharray="5,5" />
  <polygon points="360,200 370,195 370,205" fill="#f0883e" />
  
  <!-- Connections -->
  <line x1="210" y1="230" x2="210" y2="280" stroke="#c9d1d9" stroke-width="2" />
  <polygon points="210,280 205,270 215,270" fill="#c9d1d9" />
  
  <line x1="590" y1="230" x2="590" y2="280" stroke="#c9d1d9" stroke-width="2" />
  <polygon points="590,280 585,270 595,270" fill="#c9d1d9" />
  
  <line x1="400" y1="350" x2="400" y2="380" stroke="#c9d1d9" stroke-width="2" />
  <polygon points="400,380 395,370 405,370" fill="#c9d1d9" />
  
  <!-- Legend -->
  <rect x="650" y="20" width="15" height="15" fill="#161b22" stroke="#58a6ff" stroke-width="2" />
  <text x="675" y="32" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#c9d1d9">AWS</text>
  
  <rect x="650" y="40" width="15" height="15" fill="#161b22" stroke="#7ee787" stroke-width="2" />
  <text x="675" y="52" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#c9d1d9">GCP</text>
  
  <line x1="650" y1="65" x2="665" y2="65" stroke="#f0883e" stroke-width="2" stroke-dasharray="5,5" />
  <text x="675" y="68" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#c9d1d9">Migration</text>
</svg>