<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>
  
  <!-- Chiba palette -->
  <!-- base00: #090b0e, base04: #596775, base0A: #54aeff, base09: #80ccff -->
  
  <!-- Background -->
  <rect width="2560" height="1440" fill="#090b0e"/>
  
  <!-- Complex flake parts terminal output - top left -->
  <g transform="translate(60, 60)" opacity="0.25">
    <text x="0" y="0" class="mono" fill="#596775" font-size="11" font-weight="300">
      <tspan x="0" dy="0">[nixos@chiba:~/psv4]$ cat flake.nix</tspan>
      <tspan x="0" dy="18">{</tspan>
      <tspan x="0" dy="18">  inputs = {</tspan>
      <tspan x="0" dy="18">    nixpkgs.url = "github:NixOS/nixpkgs/nixos-unstable";</tspan>
      <tspan x="0" dy="18">    flake-parts.url = "github:hercules-ci/flake-parts";</tspan>
      <tspan x="0" dy="18">    treefmt-nix.url = "github:numtide/treefmt-nix";</tspan>
      <tspan x="0" dy="18">  };</tspan>
      <tspan x="0" dy="18"></tspan>
      <tspan x="0" dy="18">  outputs = inputs@{ flake-parts, ... }:</tspan>
      <tspan x="0" dy="18">    flake-parts.lib.mkFlake { inherit inputs; } {</tspan>
      <tspan x="0" dy="18">      imports = [</tspan>
      <tspan x="0" dy="18">        inputs.treefmt-nix.flakeModule</tspan>
      <tspan x="0" dy="18">        ./nix/devshells.nix</tspan>
      <tspan x="0" dy="18">        ./nix/packages.nix</tspan>
      <tspan x="0" dy="18">      ];</tspan>
      <tspan x="0" dy="18">      </tspan>
      <tspan x="0" dy="18">      systems = [ "x86_64-linux" "aarch64-linux" ];</tspan>
      <tspan x="0" dy="18">      </tspan>
      <tspan x="0" dy="18">      perSystem = { config, self', inputs', pkgs, system, ... }: {</tspan>
      <tspan x="0" dy="18">        packages.default = pkgs.callPackage ./default.nix { };</tspan>
      <tspan x="0" dy="18">      };</tspan>
      <tspan x="0" dy="18">    };</tspan>
      <tspan x="0" dy="18">}</tspan>
      <tspan x="0" dy="18"></tspan>
      <tspan x="0" dy="18">[nixos@chiba:~/psv4]$ nix build .#psv4 --json | jq -r '.[0].outputs.out'</tspan>
      <tspan x="0" dy="18">/nix/store/x7q9...f3p2-psv4-0.1.0</tspan>
      <tspan x="0" dy="18"></tspan>
      <tspan x="0" dy="18">[nixos@chiba:~/psv4]$ nix copy --to ssh://root@zero-cool.sprawl.psv4.io ./result</tspan>
      <tspan x="0" dy="18">copying path '/nix/store/x7q9...f3p2-psv4-0.1.0' to 'ssh://root@zero-cool.sprawl.psv4.io'...</tspan>
      <tspan x="0" dy="18">[████████████████████████████████] 247.3 MiB/247.3 MiB</tspan>
    </text>
  </g>
  
  <!-- System stats readout - top right -->
  <g transform="translate(2300, 60)" opacity="0.2">
    <text x="0" y="0" class="mono" fill="#596775" font-size="10" font-weight="300" text-anchor="end">
      <tspan x="0" dy="0">SYSTEM::CHIBA</tspan>
      <tspan x="0" dy="16">━━━━━━━━━━━━━━━━━━━━</tspan>
      <tspan x="0" dy="16">CPU: AMD Ryzen AI 9 HX 370</tspan>
      <tspan x="0" dy="16">LOAD: 2.14 1.89 1.92</tspan>
      <tspan x="0" dy="16">MEM: 24.7G / 32.0G</tspan>
      <tspan x="0" dy="16">SWAP: 0.0G / 0.0G</tspan>
      <tspan x="0" dy="16">UPTIME: 14d 3h 27m</tspan>
      <tspan x="0" dy="16">━━━━━━━━━━━━━━━━━━━━</tspan>
      <tspan x="0" dy="16">NIX-STORE: 184.2 GiB</tspan>
      <tspan x="0" dy="16">GENERATION: 247</tspan>
      <tspan x="0" dy="16">KERNEL: 6.1.0</tspan>
    </text>
  </g>
  
  <!-- Main statement - lower left, prominent -->
  <g transform="translate(120, 1200)">
    <text x="0" y="0" class="mono" font-size="80" font-weight="300">
      <tspan fill="#54aeff">//</tspan>
      <tspan fill="#596775" dx="20">hyper</tspan>
      <tspan fill="#54aeff" dx="20">//</tspan>
      <tspan fill="#596775" dx="20">modern</tspan>
      <tspan fill="#54aeff" dx="20">//</tspan>
      <tspan fill="#596775" dx="20">nixos</tspan>
    </text>
  </g>
  
  <!-- Minimal process list - bottom right -->
  <g transform="translate(2300, 1340)" opacity="0.15">
    <text x="0" y="0" class="mono" fill="#596775" font-size="9" font-weight="300" text-anchor="end">
      <tspan x="0" dy="0">PID    %CPU  COMMAND</tspan>
      <tspan x="0" dy="12">1247   12.3  /run/current-system/sw/bin/nix-daemon</tspan>
      <tspan x="0" dy="12">8934   8.7   /nix/store/.../firefox</tspan>
      <tspan x="0" dy="12">2156   4.2   /nix/store/.../wayland-compositor</tspan>
    </text>
  </g>
</svg>