<svg width="3840" height="2800" viewBox="0 0 3840 2800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&amp;display=swap');
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .mono { font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace; }
    </style>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#54aeff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0969da;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="3840" height="2800" fill="#ffffff"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="3840" height="200" fill="#111417"/>
  <text x="120" y="120" class="sans" fill="#ffffff" font-size="72" font-weight="200" letter-spacing="-2">hypermodern</text>
  <text x="120" y="160" class="sans" fill="#596775" font-size="24" font-weight="400">Visual Identity Guidelines v4.0</text>
  
  <!-- Logo Section -->
  <g transform="translate(120, 300)">
    <text x="0" y="0" class="sans" fill="#111417" font-size="18" font-weight="600" letter-spacing="2">01 — LOGO</text>
    
    <!-- Primary Logo -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="600" height="200" fill="#f8f9fa" stroke="#e1e4e8" stroke-width="1"/>
      <text x="300" y="110" class="sans" fill="#111417" font-size="48" font-weight="300" text-anchor="middle" letter-spacing="-1">hypermodern</text>
    </g>
    
    <!-- Logo Variations -->
    <g transform="translate(650, 60)">
      <rect x="0" y="0" width="300" height="95" fill="#111417"/>
      <text x="150" y="55" class="sans" fill="#ffffff" font-size="24" font-weight="300" text-anchor="middle">hypermodern</text>
      
      <rect x="0" y="105" width="300" height="95" fill="#54aeff"/>
      <text x="150" y="160" class="sans" fill="#ffffff" font-size="24" font-weight="300" text-anchor="middle">hypermodern</text>
    </g>
    
    <!-- Minimum Size -->
    <g transform="translate(1000, 60)">
      <text x="0" y="-10" class="sans" fill="#596775" font-size="12" font-weight="400">Minimum Size</text>
      <rect x="0" y="0" width="150" height="50" fill="#f8f9fa" stroke="#e1e4e8" stroke-width="1"/>
      <text x="75" y="30" class="sans" fill="#111417" font-size="14" font-weight="300" text-anchor="middle">hypermodern</text>
      <text x="0" y="70" class="sans" fill="#596775" font-size="11">150px × 50px</text>
    </g>
    
    <!-- Clear Space -->
    <g transform="translate(0, 300)">
      <text x="0" y="0" class="sans" fill="#596775" font-size="14" font-weight="500">Clear Space</text>
      <g transform="translate(0, 30)">
        <rect x="40" y="40" width="200" height="60" fill="#f8f9fa" stroke="#e1e4e8" stroke-width="1"/>
        <text x="140" y="75" class="sans" fill="#111417" font-size="20" font-weight="300" text-anchor="middle">hypermodern</text>
        <!-- Clear space indicators -->
        <rect x="0" y="0" width="280" height="140" fill="none" stroke="#54aeff" stroke-width="1" stroke-dasharray="5,5"/>
        <text x="290" y="70" class="sans" fill="#54aeff" font-size="11">x = cap height</text>
      </g>
    </g>
  </g>
  
  <!-- Typography Section -->
  <g transform="translate(120, 800)">
    <text x="0" y="0" class="sans" fill="#111417" font-size="18" font-weight="600" letter-spacing="2">02 — TYPOGRAPHY</text>
    
    <!-- Type Scale -->
    <g transform="translate(0, 60)">
      <text x="0" y="0" class="sans" fill="#111417" font-size="72" font-weight="200">Aa</text>
      <text x="150" y="0" class="sans" fill="#596775" font-size="14" font-weight="400">Inter Light / 72pt / -2% tracking</text>
      
      <text x="0" y="100" class="sans" fill="#111417" font-size="48" font-weight="300">The quick brown</text>
      <text x="0" y="140" class="sans" fill="#596775" font-size="14" font-weight="400">Inter Light / 48pt / -1% tracking</text>
      
      <text x="0" y="220" class="sans" fill="#111417" font-size="24" font-weight="400">The quick brown fox jumps</text>
      <text x="0" y="250" class="sans" fill="#596775" font-size="14" font-weight="400">Inter Regular / 24pt / 0% tracking</text>
      
      <text x="0" y="320" class="sans" fill="#111417" font-size="16" font-weight="400">The quick brown fox jumps over the lazy dog</text>
      <text x="0" y="345" class="sans" fill="#596775" font-size="14" font-weight="400">Inter Regular / 16pt / 0% tracking</text>
    </g>
    
    <!-- Weights -->
    <g transform="translate(800, 60)">
      <text x="0" y="0" class="sans" fill="#111417" font-size="24" font-weight="200">Light 200</text>
      <text x="0" y="40" class="sans" fill="#111417" font-size="24" font-weight="300">Light 300</text>
      <text x="0" y="80" class="sans" fill="#111417" font-size="24" font-weight="400">Regular 400</text>
      <text x="0" y="120" class="sans" fill="#111417" font-size="24" font-weight="500">Medium 500</text>
      <text x="0" y="160" class="sans" fill="#111417" font-size="24" font-weight="600">Semibold 600</text>
      <text x="0" y="200" class="sans" fill="#111417" font-size="24" font-weight="700">Bold 700</text>
    </g>
  </g>
  
  <!-- Color Section -->
  <g transform="translate(120, 1300)">
    <text x="0" y="0" class="sans" fill="#111417" font-size="18" font-weight="600" letter-spacing="2">03 — COLOR PALETTE</text>
    
    <!-- Primary Colors -->
    <g transform="translate(0, 60)">
      <text x="0" y="-10" class="sans" fill="#596775" font-size="14" font-weight="500">Primary</text>
      
      <g>
        <rect x="0" y="0" width="200" height="120" fill="#54aeff"/>
        <text x="20" y="90" class="sans" fill="#ffffff" font-size="14" font-weight="600">Hero Blue</text>
        <text x="20" y="105" class="mono" fill="#ffffff" font-size="12">#54AEFF</text>
      </g>
      
      <g transform="translate(220, 0)">
        <rect x="0" y="0" width="200" height="120" fill="#111417"/>
        <text x="20" y="90" class="sans" fill="#ffffff" font-size="14" font-weight="600">Deep Black</text>
        <text x="20" y="105" class="mono" fill="#ffffff" font-size="12">#111417</text>
      </g>
    </g>
    
    <!-- Secondary Colors -->
    <g transform="translate(0, 220)">
      <text x="0" y="-10" class="sans" fill="#596775" font-size="14" font-weight="500">Secondary</text>
      
      <g>
        <rect x="0" y="0" width="150" height="100" fill="#0969da"/>
        <text x="75" y="80" class="mono" fill="#ffffff" font-size="11" text-anchor="middle">#0969DA</text>
      </g>
      
      <g transform="translate(160, 0)">
        <rect x="0" y="0" width="150" height="100" fill="#218bff"/>
        <text x="75" y="80" class="mono" fill="#ffffff" font-size="11" text-anchor="middle">#218BFF</text>
      </g>
      
      <g transform="translate(320, 0)">
        <rect x="0" y="0" width="150" height="100" fill="#80ccff"/>
        <text x="75" y="80" class="mono" fill="#111417" font-size="11" text-anchor="middle">#80CCFF</text>
      </g>
      
      <g transform="translate(480, 0)">
        <rect x="0" y="0" width="150" height="100" fill="#b6e3ff"/>
        <text x="75" y="80" class="mono" fill="#111417" font-size="11" text-anchor="middle">#B6E3FF</text>
      </g>
    </g>
    
    <!-- Neutral Colors -->
    <g transform="translate(0, 350)">
      <text x="0" y="-10" class="sans" fill="#596775" font-size="14" font-weight="500">Neutral</text>
      
      <g>
        <rect x="0" y="0" width="120" height="80" fill="#181c21"/>
        <text x="60" y="65" class="mono" fill="#ffffff" font-size="10" text-anchor="middle">#181C21</text>
      </g>
      
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="120" height="80" fill="#21262d"/>
        <text x="60" y="65" class="mono" fill="#ffffff" font-size="10" text-anchor="middle">#21262D</text>
      </g>
      
      <g transform="translate(260, 0)">
        <rect x="0" y="0" width="120" height="80" fill="#596775"/>
        <text x="60" y="65" class="mono" fill="#ffffff" font-size="10" text-anchor="middle">#596775</text>
      </g>
      
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="120" height="80" fill="#d8e0e7"/>
        <text x="60" y="65" class="mono" fill="#111417" font-size="10" text-anchor="middle">#D8E0E7</text>
      </g>
      
      <g transform="translate(520, 0)">
        <rect x="0" y="0" width="120" height="80" fill="#f8f9fa" stroke="#e1e4e8"/>
        <text x="60" y="65" class="mono" fill="#111417" font-size="10" text-anchor="middle">#F8F9FA</text>
      </g>
    </g>
  </g>
  
  <!-- Applications -->
  <g transform="translate(1400, 300)">
    <text x="0" y="0" class="sans" fill="#111417" font-size="18" font-weight="600" letter-spacing="2">04 — APPLICATIONS</text>
    
    <!-- Business Card -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="400" height="250" fill="#111417"/>
      <text x="40" y="60" class="sans" fill="#54aeff" font-size="32" font-weight="200">hypermodern</text>
      <text x="40" y="140" class="sans" fill="#ffffff" font-size="16" font-weight="300">Alex Chen</text>
      <text x="40" y="165" class="sans" fill="#596775" font-size="14" font-weight="300">Systems Architect</text>
      <text x="40" y="210" class="mono" fill="#596775" font-size="11">alex@hypermodern.dev</text>
    </g>
    
    <!-- Digital Application -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="400" height="250" fill="#f8f9fa" stroke="#e1e4e8"/>
      <rect x="0" y="0" width="400" height="60" fill="#111417"/>
      <text x="30" y="38" class="sans" fill="#ffffff" font-size="20" font-weight="300">hypermodern</text>
      <circle cx="350" cy="30" r="20" fill="#54aeff"/>
      <text x="350" y="36" class="sans" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">hm</text>
    </g>
  </g>
  
  <!-- Usage Examples -->
  <g transform="translate(1400, 900)">
    <text x="0" y="0" class="sans" fill="#111417" font-size="18" font-weight="600" letter-spacing="2">05 — VOICE &amp; TONE</text>
    
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="800" height="400" fill="#f8f9fa"/>
      
      <text x="40" y="60" class="sans" fill="#111417" font-size="24" font-weight="300">Our Principles</text>
      
      <text x="40" y="120" class="sans" fill="#54aeff" font-size="18" font-weight="600">Clean</text>
      <text x="40" y="145" class="sans" fill="#596775" font-size="14" font-weight="400" style="max-width: 300px">
        No unnecessary complexity. Every element has purpose.
      </text>
      
      <text x="40" y="200" class="sans" fill="#54aeff" font-size="18" font-weight="600">Technical</text>
      <text x="40" y="225" class="sans" fill="#596775" font-size="14" font-weight="400">
        Precise language. No marketing fluff.
      </text>
      
      <text x="40" y="280" class="sans" fill="#54aeff" font-size="18" font-weight="600">Honest</text>
      <text x="40" y="

### 

305" class="sans" fill="#596775" font-size="14" font-weight="400">
        Transparent about capabilities and limitations.
      </text>
    </g>
  </g>
  
  <!-- Footer -->
  <g transform="translate(120, 2600)">
    <rect x="-120" y="-80" width="3840" height="200" fill="#111417"/>
    <text x="0" y="0" class="sans" fill="#54aeff" font-size="48" font-weight="200" letter-spacing="-1">hypermodern</text>
    <text x="0" y="40" class="sans" fill="#596775" font-size="16" font-weight="400">© 2024 Hypermodern Systems. Build with confidence.</text>
  </g>
</svg>
